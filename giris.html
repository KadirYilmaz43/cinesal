<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — Cinesal</title>
        <link rel="icon" type="image/png" href="images/cinesal-icon.png">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
    <a href="index.html">
        <img src="images/cinesal-logo.png" alt="Cinesal Logo" class="logo-img">
    </a>
</div>

        <ul class="nav-links">
            <li><a href="index.html">Ana Sayfa</a></li>
            <li><a href="filmler.html">Filmler</a></li>
            <li><a href="diziler.html">Diziler</a></li>
            <li><a href="hakkimizda.html">Hakkımızda</a></li>
        </ul>
        <div class="nav-actions">
            <a href="giris.html" class="btn-giris">Giriş Yap</a>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container">

            <!-- SEKMELER -->
            <div class="auth-tabs">
                <button class="auth-tab aktif" id="girisTab">Giriş Yap</button>
                <button class="auth-tab" id="kayitTab">Kayıt Ol</button>
            </div>

            <!-- GİRİŞ FORMU -->
            <div class="auth-form" id="girisForm">
                <h2>Tekrar Hoş Geldin!</h2>
                <p class="auth-sub">Hesabına giriş yap ve izlemeye devam et.</p>
                <div class="form-grup">
                    <label>E-posta</label>
                    <input type="email" id="girisEmail" placeholder="ornek@email.com">
                </div>
                <div class="form-grup">
                    <label>Şifre</label>
                    <input type="password" id="girisSifre" placeholder="••••••••">
                </div>
                <div class="form-mesaj" id="girisMesaj"></div>
                <button class="auth-btn" onclick="girisYap()">Giriş Yap</button>
            </div>

            <!-- KAYIT FORMU -->
            <div class="auth-form gizli" id="kayitForm">
                <h2>Aramıza Katıl!</h2>
                <p class="auth-sub">Ücretsiz hesap oluştur, hemen izlemeye başla.</p>
                <div class="form-grup">
                    <label>Ad Soyad</label>
                    <input type="text" id="kayitAd" placeholder="Adın Soyadın">
                </div>
                <div class="form-grup">
                    <label>E-posta</label>
                    <input type="email" id="kayitEmail" placeholder="ornek@email.com">
                </div>
                <div class="form-grup">
                    <label>Şifre</label>
                    <input type="password" id="kayitSifre" placeholder="En az 6 karakter">
                </div>
                <div class="form-grup">
                    <label>Şifre Tekrar</label>
                    <input type="password" id="kayitSifreTekrar" placeholder="Şifreni tekrar gir">
                </div>
                <div class="form-mesaj" id="kayitMesaj"></div>
                <button class="auth-btn" onclick="kayitOl()">Kayıt Ol</button>
            </div>

        </div>
    </section>

    <script src="js/auth.js"></script>
</body>
</html>
